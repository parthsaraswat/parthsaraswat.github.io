<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{page_title}} &mdash; Parth Saraswat</title>
<meta name="description" content="{{page_desc}}" />
<link rel="icon" type="image/svg+xml" href="{{favicon_path}}" />
<link rel="stylesheet" href="{{css_path}}" />
<link rel="alternate" type="application/rss+xml" title="Parth Saraswat" href="{{feed_path}}" />
</head>
<body>
  <div class="c-root">
    <div class="c-col">
      <nav class="c-nav">
        <a href="{{home_path}}" class="c-mark">P.<span class="c-slash">/</span>Saraswat</a>
        <div class="c-nav-links">
          <a href="{{home_path}}">Home</a>
          <a href="{{blog_path}}" class="active">Blog</a>
          <button class="c-theme-toggle" aria-label="Toggle theme"></button>
        </div>
      </nav>

      <section class="c-blog">
        <h1 class="c-blog-h1">{{h1}}</h1>
        <p class="c-blog-lede">{{lede}}</p>
{{tag_filters}}
        <div class="c-blog-entries">
{{entries}}
        </div>
      </section>
    </div>
  </div>
  <script src="{{script_path}}"></script>
</body>
</html>
